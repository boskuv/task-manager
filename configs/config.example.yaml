server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s

database:
  dsn: "taskmanager:taskmanager@tcp(localhost:3306)/taskmanager?parseTime=true&charset=utf8mb4"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  auto_migrate: true
  migrations_dir: migrations

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  secret: dev-secret-change-me
  access_ttl: 24h

rate_limit:
  requests_per_minute: 100

logging:
  level: info
  format: text
